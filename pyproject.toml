[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "regulatory-evidence-workbench"
version = "0.1.0"
description = "Citation-first regulatory evidence comparison workbench"
requires-python = ">=3.11"
dependencies = [
  "agent-framework-azure-ai",
  "agent-framework-foundry",
  "azure-ai-inference>=1.0.0b9",
  "azure-ai-projects==2.3.0",
  "azure-identity>=1.24.0",
  "azure-search-documents==12.1.0b2",
  "azure-storage-blob>=12.26.0",
  "fastapi>=0.116.0",
  "openpyxl>=3.1",
  "pypdf>=5.9.0",
  "python-docx>=1.2.0",
  "python-multipart>=0.0.20",
  "streamlit>=1.48.0",
  "uvicorn>=0.35.0",
]

[project.scripts]
regulatory-poc = "regulatory_poc.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regulatory_poc = ["config/*.json"]
